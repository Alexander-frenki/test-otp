name: ReKey merge approval

# Every new head of a pull request asks the pusher's phone; the required check is
# the commit status `rekey/merge-approval` that approve.sh sets on that head.
# A missed or refused approval is asked again with "Re-run jobs".
on:
  pull_request:
    types: [opened, reopened, synchronize, ready_for_review]

permissions:
  contents: read
  statuses: write

concurrency:
  group: rekey-merge-approval-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  approve:
    if: ${{ !github.event.pull_request.draft }}
    name: Approve on the phone
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v4
      - name: Ask the pusher's phone through rekey-backend
        run: .github/rekey/approve.sh
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
          TITLE: ${{ github.event.pull_request.title }}
          BASE: ${{ github.event.pull_request.base.ref }}
          SHA: ${{ github.event.pull_request.head.sha }}
          ACTOR: ${{ github.triggering_actor }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          REKEY_BACKEND_URL: ${{ vars.REKEY_BACKEND_URL }}
          REKEY_BACKEND_TOKEN: ${{ secrets.REKEY_BACKEND_TOKEN }}
